# A version tag (v1.2.3) → checks and build → migrate the production database → deploy the built worker → smoke test.
# The `production` GitHub environment can require a reviewer before this job runs.
# Needs repository secrets CLOUDFLARE_API_TOKEN (Workers, D1, R2 edit) and CLOUDFLARE_ACCOUNT_ID.
name: Deploy production

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://nexphaselabs.net
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Checks
        run: |
          npx tsc --noEmit
          npm run lint
          npm test
      - name: Build (production configuration)
        # The build must succeed BEFORE the database is touched: a migration cannot be undone by a rollback.
        run: npm run build
      - name: Apply migrations (production D1)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run db:migrate:prod
      - name: Seed reference data (idempotent, INSERT OR IGNORE)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm run db:seed:generate
          npx wrangler d1 execute nexphase-labs --remote --file drizzle/seed/classes.sql
      - name: Deploy the built worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config dist/server/wrangler.json
      - name: Smoke test
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS "https://nexphaselabs.net/api/health" | grep -q '"ok":true'; then echo "healthy"; exit 0; fi
            sleep 10
          done
          echo "production did not report healthy"; exit 1
      - name: Rollback hint
        if: failure()
        run: |
          echo "Deploy failed."
          echo "If the worker was uploaded, roll it back with 'npx wrangler rollback' (docs/DEPLOY.md). Migrations are additive and stay in place."
