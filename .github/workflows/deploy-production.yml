# A version tag (v1.2.3) → checks and build → migrate the production database → deploy the built worker → smoke test.
# The `production` GitHub environment can require a reviewer before this job runs.
# Needs repository secrets CLOUDFLARE_API_TOKEN (Workers, D1, R2 edit) and CLOUDFLARE_ACCOUNT_ID,
# plus repository variable PRODUCTION_SMOKE_URL (the workers.dev production origin used before DNS cutover).
#
# The tag is the only way in. workflow_dispatch stays available so an interrupted release can be
# re-run, but the first step refuses any ref that is not a v* tag — dispatching a branch does not
# deploy it. scripts/deploy-guard.mjs enforces the same rule again from a laptop.
name: Deploy production

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://nexphaselabs.net
    steps:
      - name: Release must be a v* tag
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" != "tag" ]; then
            echo "Refusing: this run is on $REF_TYPE '$REF_NAME'. Production is released from a version tag."
            echo "Tag the reviewed commit (git tag -a v1.2.3 -m '...' && git push origin v1.2.3)."
            exit 1
          fi
          case "$REF_NAME" in
            v*) echo "Releasing $REF_NAME" ;;
            *) echo "Refusing: tag '$REF_NAME' is not a v* version tag."; exit 1 ;;
          esac
      - name: Require the production Worker smoke origin
        env:
          PRODUCTION_SMOKE_URL: ${{ vars.PRODUCTION_SMOKE_URL }}
        run: |
          if [ "$PRODUCTION_SMOKE_URL" != "https://nexphaselabs.nexphase.workers.dev" ]; then
            echo "Set PRODUCTION_SMOKE_URL to the production workers.dev origin before releasing."
            echo "The public domain stays on WordPress until the separate cutover checklist is complete."
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Checks
        run: |
          npx tsc --noEmit
          npm run lint
          npm test
      - name: Build (production configuration)
        # The build must succeed BEFORE the database is touched: a migration cannot be undone by a rollback.
        run: npm run build
      - name: Deploy guard (built config must target production)
        # Before the database is touched: a migration cannot be undone by a rollback.
        env:
          NX_CONFIRM_PRODUCTION: "yes"
        run: node scripts/deploy-guard.mjs production
      - name: Apply migrations (production D1)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run db:migrate:prod
      - name: Seed reference data (idempotent, INSERT OR IGNORE)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm run db:seed:generate
          npx wrangler d1 execute nexphase-labs --remote --file drizzle/seed/classes.sql
      - name: Deploy the built worker
        env:
          NX_CONFIRM_PRODUCTION: "yes"
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/deploy-guard.mjs production && npx wrangler deploy --config dist/server/wrangler.json
      - name: Smoke test
        # Healthy is not proof the release took effect: the worker it replaced answers ok too. Pass only
        # once /api/health names the commit this tag built (GITHUB_SHA, written in by vite.config.ts).
        env:
          PRODUCTION_SMOKE_URL: ${{ vars.PRODUCTION_SMOKE_URL }}
        run: |
          for i in 1 2 3 4 5 6; do
            health=$(curl -fsS "$PRODUCTION_SMOKE_URL/api/health" || true)
            if printf '%s' "$health" | grep -q '"ok":true' && printf '%s' "$health" | grep -q '"env":"production"' && printf '%s' "$health" | grep -q "\"release\":\"$GITHUB_SHA\""; then
              echo "production Worker healthy on $GITHUB_SHA"
              exit 0
            fi
            sleep 10
          done
          echo "production Worker did not report healthy on $GITHUB_SHA at $PRODUCTION_SMOKE_URL/api/health; last answer: ${health:-none}"
          exit 1
      - name: Rollback hint
        if: failure()
        run: |
          echo "Deploy failed."
          echo "If the worker was uploaded, roll it back with 'npx wrangler rollback' (docs/DEPLOY.md). Migrations are additive and stay in place."
