# Push to main → checks and build → migrate the staging database → deploy the built worker → smoke test
# → prove the staging access boundary.
# Needs repository secrets CLOUDFLARE_API_TOKEN (Workers, D1, R2 edit) and CLOUDFLARE_ACCOUNT_ID, and the
# repository variable STAGING_URL (the staging worker's public origin, matching PUBLIC_ORIGIN in wrangler.jsonc env.staging).
name: Deploy staging

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    steps:
      - name: Require STAGING_URL
        env:
          STAGING_URL: ${{ vars.STAGING_URL }}
        run: test -n "$STAGING_URL" || { echo "Set the STAGING_URL repository variable first (docs/DEPLOY.md, Automated deploys)."; exit 1; }
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Checks
        run: |
          npx tsc --noEmit
          npm run lint
          npm test
      - name: Build (staging configuration)
        # The build must succeed BEFORE the database is touched: a migration cannot be undone by a rollback.
        run: CLOUDFLARE_ENV=staging npm run build
      - name: Built origin must match STAGING_URL
        # Staging email links are built from PUBLIC_ORIGIN; if it still holds the placeholder the deploy would
        # pass its smoke test while every link pointed at a host the account does not own.
        env:
          STAGING_URL: ${{ vars.STAGING_URL }}
        run: |
          origin=$(node -e "console.log(JSON.parse(require('fs').readFileSync('dist/server/wrangler.json','utf8')).vars.PUBLIC_ORIGIN||'')")
          if [ "$origin" != "$STAGING_URL" ]; then echo "wrangler.jsonc env.staging PUBLIC_ORIGIN is '$origin' but STAGING_URL is '$STAGING_URL' — make them the same (docs/DEPLOY.md)."; exit 1; fi
      - name: Deploy guard (built config must target staging)
        # Before the database is touched, not after: if the build carries the production name,
        # database or bucket, this job must stop while everything is still reversible.
        run: node scripts/deploy-guard.mjs staging
      - name: Access mode must come from the configuration, not a Worker secret
        # The owner chose public staging on 14 September 2026 and wrangler.jsonc env.staging declares it
        # (STAGING_ACCESS_OPEN), where it is reviewed and where the last step reads it. A Worker secret of
        # that name cannot be read back by anyone, so it would decide the mode where nobody can see it.
        # Refuse while everything is still reversible.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          secrets=$(npx wrangler secret list --env staging) || { echo "could not list the staging worker's secrets"; exit 1; }
          if printf '%s' "$secrets" | grep -q 'STAGING_ACCESS_OPEN'; then
            echo "STAGING_ACCESS_OPEN is set as a Worker secret on staging, but the access mode is declared in wrangler.jsonc."
            echo "Delete the secret, then re-run this job:  npx wrangler secret delete STAGING_ACCESS_OPEN --env staging"
            echo "Until the deploy completes, staging refuses every request with 503: the gate fails closed without it."
            exit 1
          fi
      - name: Apply migrations (staging D1)
        # Migrations are backwards-compatible by convention (docs/DEPLOY.md), so the running worker
        # keeps working during the seconds between this step and the deploy.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run db:migrate:staging
      - name: Seed reference data (idempotent, INSERT OR IGNORE)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm run db:seed:generate
          npx wrangler d1 execute nexphase-labs-staging --remote --env staging --file drizzle/seed/classes.sql
      - name: Deploy guard (re-check immediately before upload)
        run: node scripts/deploy-guard.mjs staging
      - name: Deploy the built worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config dist/server/wrangler.json
      - name: Smoke test
        env:
          STAGING_URL: ${{ vars.STAGING_URL }}
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS "$STAGING_URL/api/health" | grep -q '"ok":true'; then echo "healthy"; exit 0; fi
            sleep 10
          done
          echo "staging did not report healthy at $STAGING_URL/api/health"; exit 1
      - name: Staging access boundary (public storefront; staff area and private APIs behind their logins)
        # 16.3, then the owner's decision of 14 September 2026. The mode comes from the configuration that was
        # just deployed, never from what the server answers. Open mode: public pages answer 200 with noindex,
        # staff pages redirect to staff sign-in, private APIs answer 401. Closed mode: the password challenge on
        # every path. Any other answer is a failed deploy, not a warning. tests/staging-access-check.test.ts
        # proves both.
        env:
          STAGING_URL: ${{ vars.STAGING_URL }}
        run: node scripts/staging-access-check.mjs "$STAGING_URL" dist/server/wrangler.json
