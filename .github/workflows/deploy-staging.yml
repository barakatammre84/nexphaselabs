# Push to main → checks and build → migrate the staging database → deploy the built worker → smoke test
# → prove the staging access boundary.
# Needs repository secrets CLOUDFLARE_API_TOKEN (Workers, D1, R2 edit) and CLOUDFLARE_ACCOUNT_ID, and the
# repository variable STAGING_URL (the staging worker's public origin, matching PUBLIC_ORIGIN in wrangler.jsonc env.staging).
name: Deploy staging

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    steps:
      - name: Require STAGING_URL
        env:
          STAGING_URL: ${{ vars.STAGING_URL }}
        run: test -n "$STAGING_URL" || { echo "Set the STAGING_URL repository variable first (docs/DEPLOY.md, Automated deploys)."; exit 1; }
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Checks
        run: |
          npx tsc --noEmit
          npm run lint
          npm test
      - name: Build (staging configuration)
        # The build must succeed BEFORE the database is touched: a migration cannot be undone by a rollback.
        run: CLOUDFLARE_ENV=staging npm run build
      - name: Built origin must match STAGING_URL
        # Staging email links are built from PUBLIC_ORIGIN; if it still holds the placeholder the deploy would
        # pass its smoke test while every link pointed at a host the account does not own.
        env:
          STAGING_URL: ${{ vars.STAGING_URL }}
        run: |
          origin=$(node -e "console.log(JSON.parse(require('fs').readFileSync('dist/server/wrangler.json','utf8')).vars.PUBLIC_ORIGIN||'')")
          if [ "$origin" != "$STAGING_URL" ]; then echo "wrangler.jsonc env.staging PUBLIC_ORIGIN is '$origin' but STAGING_URL is '$STAGING_URL' — make them the same (docs/DEPLOY.md)."; exit 1; fi
      - name: Deploy guard (built config must target staging)
        # Before the database is touched, not after: if the build carries the production name,
        # database or bucket, this job must stop while everything is still reversible.
        run: node scripts/deploy-guard.mjs staging
      - name: Access mode must come from the configuration, not a Worker secret
        # The owner chose public staging on 14 September 2026 and wrangler.jsonc env.staging declares it
        # (STAGING_ACCESS_OPEN), where it is reviewed and where the last step reads it. A Worker secret of
        # that name cannot be read back by anyone, so it would decide the mode where nobody can see it.
        # Refuse while everything is still reversible.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          secrets=$(npx wrangler secret list --env staging) || { echo "could not list the staging worker's secrets"; exit 1; }
          if printf '%s' "$secrets" | grep -q 'STAGING_ACCESS_OPEN'; then
            echo "STAGING_ACCESS_OPEN is set as a Worker secret on staging, but the access mode is declared in wrangler.jsonc."
            echo "Delete the secret, then re-run this job:  npx wrangler secret delete STAGING_ACCESS_OPEN --env staging"
            echo "Until the deploy completes, staging refuses every request with 503: the gate fails closed without it."
            exit 1
          fi
      - name: Apply migrations (staging D1)
        id: staging-migrations
        # Migrations are backwards-compatible by convention (docs/DEPLOY.md), so the running worker
        # keeps working during the seconds between this step and the deploy.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          npm run db:migrate:staging 2>&1 | tee staging-migration.log
      - name: Seed reference data (idempotent, INSERT OR IGNORE)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm run db:seed:generate
          npx wrangler d1 execute nexphase-labs-staging --remote --env staging --file drizzle/seed/classes.sql
      - name: Deploy guard (re-check immediately before upload)
        run: node scripts/deploy-guard.mjs staging
      - name: Deploy the built worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config dist/server/wrangler.json
      - name: Staging release and migration proof
        # The read-only health report must identify both this build and the exact D1
        # migration history from the journal before any staging smoke test runs.
        env:
          STAGING_URL: ${{ vars.STAGING_URL }}
        run: node scripts/staging-migration-check.mjs "$STAGING_URL" "$GITHUB_SHA"
      - name: Smoke test
        # Healthy is not proof the deploy took effect: the worker it replaced answers ok too. Pass only
        # once /api/health names the commit this job built (GITHUB_SHA, written in by vite.config.ts).
        env:
          STAGING_URL: ${{ vars.STAGING_URL }}
        run: |
          for i in 1 2 3 4 5 6; do
            health=$(curl -fsS "$STAGING_URL/api/health" || true)
            if printf '%s' "$health" | grep -q '"ok":true' && printf '%s' "$health" | grep -q "\"release\":\"$GITHUB_SHA\""; then
              echo "staging healthy on $GITHUB_SHA"; exit 0
            fi
            sleep 10
          done
          echo "staging did not report healthy on $GITHUB_SHA at $STAGING_URL/api/health; last answer: ${health:-none}"; exit 1
      - name: Staging access boundary (public storefront; staff area and private APIs behind their logins)
        # 16.3, then the owner's decision of 14 September 2026. The mode comes from the configuration that was
        # just deployed, never from what the server answers. Open mode: public pages answer 200 with noindex,
        # staff pages redirect to staff sign-in, private APIs answer 401. Closed mode: the password challenge on
        # every path. Any other answer is a failed deploy, not a warning. tests/staging-access-check.test.ts
        # proves both.
        env:
          STAGING_URL: ${{ vars.STAGING_URL }}
        run: node scripts/staging-access-check.mjs "$STAGING_URL" dist/server/wrangler.json
      - name: Refund retry rehearsal
        id: staging-refund-rehearsal
        env:
          STAGING_URL: ${{ vars.STAGING_URL }}
          GITHUB_SHA: ${{ github.sha }}
        run: node scripts/staging-refund-rehearsal.mjs "$STAGING_URL" "$GITHUB_SHA" | tee staging-refund-rehearsal.json
      - name: Checkout browser boundary
        id: checkout-browser-boundary
        # Keep the synthetic customer's credentials in the staging environment's secrets. The browser
        # baseline never includes them in its JSON report or network evidence.
        env:
          STAGING_URL: ${{ vars.STAGING_URL }}
          STAGING_BUYING_BASELINE_EMAIL: ${{ secrets.STAGING_BUYING_BASELINE_EMAIL }}
          STAGING_BUYING_BASELINE_PASSWORD: ${{ secrets.STAGING_BUYING_BASELINE_PASSWORD }}
        run: |
          set -o pipefail
          set +e
          npx --no-install tsx scripts/store-buying-browser-baseline.ts \
            --base-url "$STAGING_URL" \
            --json | tee staging-browser-baseline.json
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            node <<'NODE'
          const { readFileSync } = require('node:fs');
          const report = JSON.parse(readFileSync('staging-browser-baseline.json', 'utf8'));
          for (const check of report.checks.filter((entry) => !entry.ok)) {
            console.error(`Checkout browser boundary failed at ${report.origin}${check.route}: ${check.detail}`);
          }
          NODE
          fi
          exit "$status"
      - name: Retain checkout browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-checkout-browser-baseline-${{ github.sha }}
          path: staging-browser-baseline.json
          if-no-files-found: error
          retention-days: 14
      - name: Write staging release report
        if: always()
        env:
          GITHUB_SHA: ${{ github.sha }}
          MIGRATION_RESULT: ${{ steps.staging-migrations.outcome }}
          REFUND_REHEARSAL_RESULT: ${{ steps.staging-refund-rehearsal.outcome }}
        run: |
          node <<'NODE'
          const { readFileSync, writeFileSync, existsSync } = require('node:fs');
          const readJson = (path) => {
            if (!existsSync(path)) return null;
            try { return JSON.parse(readFileSync(path, 'utf8')); } catch { return null; }
          };
          writeFileSync('staging-release-report.json', JSON.stringify({
            release: process.env.GITHUB_SHA,
            migration: {
              result: process.env.MIGRATION_RESULT,
              log: existsSync('staging-migration.log') ? 'staging-migration.log' : null,
            },
            refundRehearsal: {
              result: process.env.REFUND_REHEARSAL_RESULT,
              report: readJson('staging-refund-rehearsal.json'),
            },
          }, null, 2) + '\n');
          NODE
      - name: Retain staging release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-release-evidence-${{ github.sha }}
          path: |
            staging-release-report.json
            staging-migration.log
            staging-refund-rehearsal.json
          if-no-files-found: warn
          retention-days: 14
